name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    name: Build & Validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Validate HTML
        run: |
          echo "🔍 Validating HTML structure..."
          if command -v tidy &> /dev/null; then
            tidy -q -e index.html || true
          else
            echo "HTML Tidy not available, skipping validation"
          fi
          echo "✓ HTML validation complete"
      
      - name: Verify CSS
        run: |
          echo "🔍 Checking CSS file..."
          if [ -f "style.css" ]; then
            wc -l style.css
            echo "✓ CSS file found and verified"
          else
            echo "✗ CSS file not found!"
            exit 1
          fi
      
      - name: Verify JavaScript
        run: |
          echo "🔍 Checking JavaScript file..."
          if [ -f "script.js" ]; then
            wc -l script.js
            echo "✓ JavaScript file found and verified"
          else
            echo "✗ JavaScript file not found!"
            exit 1
          fi
      
      - name: Check File Structure
        run: |
          echo "📁 Verifying project structure..."
          echo "Files in root:"
          ls -la *.{html,css,js} 2>/dev/null || echo "Some files missing"
          echo ""
          echo "Assets directory:"
          if [ -d "assets" ]; then
            find assets -type f | head -20
          else
            echo "⚠️  Assets directory not found"
          fi
          echo ""
          echo "Docs directory:"
          if [ -d "docs" ]; then
            ls -la docs/
          else
            echo "⚠️  Docs directory not found"
          fi

  # Deploy job
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    # Grant GITHUB_TOKEN the permissions needed to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    name: Deploy to Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository for static site
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
      
      - name: Deployment Summary
        run: |
          echo "✅ Deployment Successful!"
          echo "📱 Page URL: ${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "🔍 Deployment Info:"
          echo "  - Repository: ${{ github.repository }}"
          echo "  - Branch: ${{ github.ref_name }}"
          echo "  - Commit: ${{ github.sha }}"
          echo ""
          echo "💡 Tips:"
          echo "  - Your portfolio is now live!"
          echo "  - CSS and JS caching may delay updates (hard refresh to see changes)"
          echo "  - Check GitHub Pages settings in repository for custom domain setup"
