<!doctype html><meta charset="utf-8"><style>
  body { margin: 0; font: 12px system-ui; }
  .row { display: flex; gap: 12px; justify-content: center; width: 1104px; height: 218.6px;
         border: 1px solid #ccc; margin-bottom: 8px; }
  .fig { flex: 0 0 auto; margin: 0; overflow: hidden; border-radius: 6px; background: #ddd; }
  .link { display: block; height: 100%; }
  .img { display: block; height: 100%; width: auto; object-fit: cover; }

  /* A: explicit height, width from the photograph. */
  .a .fig { height: 100%; }
  /* B: the current rule - needs --ar from somewhere. */
  .b .fig { height: 100%; aspect-ratio: var(--ar, 1); }
  .b .img { width: 100%; height: 100%; }
  /* C: like A but the figure is told to shrink-wrap. */
  .c .fig { height: 100%; width: max-content; }
</style>

<script>
  window.__r = () => [...document.querySelectorAll('.row')].map((row) => ({
    row: row.className,
    figs: [...row.querySelectorAll('.fig')].map((f) => {
      const img = f.querySelector('img');
      const fr = f.getBoundingClientRect();
      const ir = img.getBoundingClientRect();
      return {
        fig: [Math.round(fr.width * 100) / 100, Math.round(fr.height * 100) / 100],
        figAr: Math.round((fr.width / fr.height) * 10000) / 10000,
        img: [Math.round(ir.width * 100) / 100, Math.round(ir.height * 100) / 100],
        imgAr: Math.round((ir.width / ir.height) * 10000) / 10000,
        natural: img.naturalWidth + 'x' + img.naturalHeight,
      };
    }),
  }));
</script>
