                - paragraph [ref=f2e623]: Overview & business motive
                - paragraph [ref=f2e624]: "This repository is more than a demo — it’s the engineering backbone for a small wholesale-to-retail e-commerce operation. The intended business model is:"
                - list [ref=f2e625]:
                  - listitem [ref=f2e626]: Buy products in bulk from China (sourcing & importing).
                  - listitem [ref=f2e627]: List and sell those products online to Nepalese customers.
                  - listitem [ref=f2e628]: Keep lean operations with a simple admin panel for inventory/order management and analytics to guide purchasing decisions.
                - paragraph [ref=f2e629]: "The application is structured to support that model: product catalog with multiple images, inventory management / low-stock alerts, orders and order items, cart + checkout flow, reviews, admin analytics, and tools for managing site settings, FAQs and bug reports."
                - separator [ref=f2e630]
                - paragraph [ref=f2e631]: What’s implemented — features & code analysis
                - paragraph [ref=f2e632]: Key implemented features (buyer/customer)
                - list [ref=f2e633]:
                  - listitem [ref=f2e634]: Product catalog with product detail pages and multiple product images.
                  - listitem [ref=f2e635]: Shopping cart and checkout flow (order creation, order detail pages).
                  - listitem [ref=f2e636]: User registration and authentication (with role separation).
                  - listitem [ref=f2e637]: Reviews system (product reviews + optional review photos).
                  - listitem [ref=f2e638]: "Account pages: orders, order details, account settings, FAQs and a report-issue flow."
                  - listitem [ref=f2e639]: Responsive Blade-based frontend with Tailwind CSS and Alpine.js + dark mode support.
                - paragraph [ref=f2e640]: Key implemented features (admin panel)
                - list [ref=f2e641]:
                  - listitem [ref=f2e642]: Admin dashboard with statistics and charts (Chart.js used for analytics).
                  - listitem [ref=f2e643]: Product management (CRUD), including multiple image uploads and product forms.
                  - listitem [ref=f2e644]: Order management with status updates.
                  - listitem [ref=f2e645]: Inventory management with low-stock alerts and inventory view.
                  - listitem [ref=f2e646]: User management (view, block/unblock, delete).
                  - listitem [ref=f2e647]: Bug report and FAQ management.
                  - listitem [ref=f2e648]: Website settings (text that appears in footer, contact, etc.).
                  - listitem [ref=f2e649]: Best-selling products & reporting pages.
                - paragraph [ref=f2e650]: Security, stability, and performance
                - list [ref=f2e651]:
                  - listitem [ref=f2e652]: Bcrypt password hashing, CSRF protection, XSS protection (Blade escaping).
                  - listitem [ref=f2e653]: Eloquent ORM to avoid raw SQL and reduce SQL injection risk.
                  - listitem [ref=f2e654]: Rate limiting on login attempts and role-based access control using middleware.
                  - listitem [ref=f2e655]: Secure file upload validation.
                  - listitem [ref=f2e656]: "Production optimizations included in the checklist: Vite, Tailwind purging, route/config/view caching, eager loading for common relationships."
                - paragraph [ref=f2e657]: Code composition and notable files
                - list [ref=f2e658]:
                  - listitem [ref=f2e659]: Laravel 11 backend (PHP 8.2+ expected)
                  - listitem [ref=f2e660]: routes/web.php — organizes routes including buyer and admin routes and a debug /api/test endpoint
                  - listitem [ref=f2e661]: resources/views/ — Blade views split into buyer (guest/app) and admin folders
                  - listitem [ref=f2e662]: app/Http/Controllers — multiple controllers (Auth, buyer controllers, admin controllers)
                  - listitem [ref=f2e663]: app/Models — Eloquent models implementing relationships (products, users, orders, reviews, carts, etc.)
                  - listitem [ref=f2e664]: database/migrations — 12 migrations including products, product_images, orders, order_items, carts, reviews, review_photos, faqs, settings, bug_reports
                  - listitem [ref=f2e665]: database/seeders — seeders for users, products, FAQs and settings
                  - listitem [ref=f2e666]: storage/ — file uploads and compiled views
                  - listitem [ref=f2e667]: docker-compose.yml — ready-made MySQL docker configuration
                  - listitem [ref=f2e668]: tailwind.config.js & vite.config.js — frontend build tooling
