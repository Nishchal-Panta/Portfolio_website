                - separator [ref=f2e739]
                - paragraph [ref=f2e740]: Production & deployment notes
                - paragraph [ref=f2e741]: Important production steps
                - list [ref=f2e742]:
                  - listitem [ref=f2e743]: Configure .env for production (APP_ENV=production, secure APP_KEY, set DB credentials).
                  - listitem [ref=f2e744]: Use queue workers for long-running tasks (emails, image processing).
                  - listitem [ref=f2e745]: Configure cache & session driver (Redis recommended).
                  - listitem [ref=f2e746]: Use HTTPS everywhere and set up an SSL certificate (Let’s Encrypt).
                  - listitem [ref=f2e747]: Set appropriate file permissions for storage/ and bootstrap/cache/.
                  - listitem [ref=f2e748]: Use backups for DB and storage; implement regular snapshotting.
                  - listitem [ref=f2e749]: Monitor errors and performance (Sentry, NewRelic, or similar).
                - paragraph [ref=f2e750]: Suggested hosting & infra
                - list [ref=f2e751]:
                  - listitem [ref=f2e752]: Use a VPS or cloud provider (DigitalOcean, AWS, GCP) with managed DB or a secure instance.
                  - listitem [ref=f2e753]: Use a CDN for static assets for speed in Nepal.
                  - listitem [ref=f2e754]: Consider object storage (S3 or S3-compatible) for images if you expect many uploads.
                - paragraph [ref=f2e755]: Database & scaling
                - list [ref=f2e756]:
                  - listitem [ref=f2e757]: Add Redis for cache/session and to offload rate-limiting counters and queues.
                  - listitem [ref=f2e758]: Use database indexes for heavy queries (orders, product searches).
                  - listitem [ref=f2e759]: Use pagination and eager loading to prevent N+1 issues.
                - separator [ref=f2e760]
                - paragraph [ref=f2e761]: Business & operational recommendations for selling in Nepal
                - paragraph [ref=f2e762]: Payments
                - list [ref=f2e763]:
                  - listitem [ref=f2e764]: "Integrate Nepal-specific payment gateways: eSewa, Khalti, IME Pay, ConnectIPS if possible, plus local bank integrations and card payments (Stripe may not service Nepal directly)."
                  - listitem [ref=f2e765]: Offer cash-on-delivery as many customers in Nepal still prefer COD.
                  - listitem [ref=f2e766]: Implement invoicing and receipts in Nepali/English; consider multi-currency display but settle in NPR.
                - paragraph [ref=f2e767]: Shipping & logistics
                - list [ref=f2e768]:
                  - listitem [ref=f2e769]: Partner with local courier companies for domestic delivery (e.g., Nepal Post, private couriers).
                  - listitem [ref=f2e770]: Build shipping rate rules (weight/volume, zones).
                  - listitem [ref=f2e771]: Include expected delivery times and tracking (if available).
                - paragraph [ref=f2e772]: Import & sourcing (China → Nepal)
                - list [ref=f2e773]:
                  - listitem [ref=f2e774]: Account for lead time, customs duties, VAT, and import process when setting pricing.
                  - listitem [ref=f2e775]: Maintain an importer-facing inventory/purchase order workflow so you know when to reorder in bulk.
                  - listitem [ref=f2e776]: Keep a spreadsheet or simple subsystem to compare landed costs per SKU (unit price + shipping + import fees + taxes).
                - paragraph [ref=f2e777]: Localization & compliance
                - list [ref=f2e778]:
                  - listitem [ref=f2e779]: Use Nepali language support (Unicode UTF-8), local date/time, currency formatting (NPR).
                  - listitem [ref=f2e780]: Ensure return policy, T&Cs and privacy policy are clearly visible.
                  - listitem [ref=f2e781]: Comply with local regulations for e-commerce and taxes.
                - paragraph [ref=f2e782]: Pricing & catalog strategy
                - list [ref=f2e783]:
                  - listitem [ref=f2e784]: Use margin calculators; show cost, markup and suggested retail price in admin.
                  - listitem [ref=f2e785]: Start with a curated catalog (top-selling low-risk SKUs) rather than everything to simplify operations.
                - paragraph [ref=f2e786]: Marketing & growth
                - list [ref=f2e787]:
                  - listitem [ref=f2e788]: Add social logins and email marketing integration (Mailchimp, similar).
                  - listitem [ref=f2e789]: SEO-friendly product pages, meta tags and schema.org markup help organic discovery.
                  - listitem [ref=f2e790]: Track analytics (Google Analytics) and use admin charts to drive purchase decisions.
                - separator [ref=f2e791]
                - paragraph [ref=f2e792]: What’s next to make it sell-ready (technical + operational)
                - paragraph [ref=f2e793]: Top-priority technical tasks
                - list [ref=f2e794]:
                  - listitem [ref=f2e795]: Integrate at least one local payment gateway (eSewa or Khalti) and COD flow.
                  - listitem [ref=f2e796]: Add order email notifications and SMS notifications (order confirmations, shipping updates).
                  - listitem [ref=f2e797]: Add multi-warehouse or supplier indicators if you plan to manage stock across importer & retail inventory.
                  - listitem [ref=f2e798]: Implement product import tooling (CSV/XLSX) for bulk product additions from supplier catalogs.
                  - listitem [ref=f2e799]: Add basic audit logs for inventory / price changes.
                  - listitem [ref=f2e800]: Set up scheduled tasks and queues for background processing.
                - paragraph [ref=f2e801]: Operational steps
                - list [ref=f2e802]:
                  - listitem [ref=f2e803]: Finalize supplier relationships and define reorder points (use the inventory low-stock alerts already in the admin).
                  - listitem [ref=f2e804]: Prepare product photography guidelines and ensure good image quality for listing trust.
                  - listitem [ref=f2e805]: Create returns & refunds SOP and include it in site settings.
                - paragraph [ref=f2e806]: Monetization & sellability
                - list [ref=f2e807]:
                  - listitem [ref=f2e808]: Add invoicing, order export for accounting, and exportable reports (CSV/PDF).
                  - listitem [ref=f2e809]: Add admin role and permission granularity if other teammates will operate the site.
                - separator [ref=f2e810]
                - paragraph [ref=f2e811]: Testing & QA checklist (summary)
                - paragraph [ref=f2e812]: "From the project’s TESTING_CHECKLIST.md and code review:"
                - list [ref=f2e813]:
                  - listitem [ref=f2e814]: Backend migrations & seeders executed and validated (completed).
                  - listitem [ref=f2e815]: Frontend views and layout tested for responsiveness and dark mode (completed).
                  - listitem [ref=f2e816]: Route & auth protection verified (IsAdmin / IsBuyer / CheckBlocked middleware in place).
                  - listitem [ref=f2e817]: File upload validation and image resizing / validation present (confirm on staging).
                  - listitem [ref=f2e818]: "Performance: Vite, Tailwind purging, view/route/config caching applied; recommend load testing."
                - paragraph [ref=f2e819]: Recommended tests before production
                - list [ref=f2e820]:
                  - listitem [ref=f2e821]: End-to-end checkout test (including payment gateway & order lifecycle).
                  - listitem [ref=f2e822]: Import and inventory reconciliation test (supplier → admin → store).
                  - listitem [ref=f2e823]: "Security review: penetration test for file uploads, auth, rate limits."
                  - listitem [ref=f2e824]: Backup & restore test (database + uploads).
                - separator [ref=f2e825]
                - paragraph [ref=f2e826]: Contributing
                - list [ref=f2e827]:
                  - listitem [ref=f2e828]: Fork the repo, create a feature branch, and open a PR with a clear description and testing steps.
                  - listitem [ref=f2e829]: For major features (payment gateways, shipping integration, supplier import), discuss proposed design in an issue first.
