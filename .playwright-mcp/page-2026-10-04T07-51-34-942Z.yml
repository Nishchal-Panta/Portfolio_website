                  - listitem [ref=f2e708]:
                    - paragraph [ref=f2e709]: "Install backend dependencies: composer install"
                  - listitem [ref=f2e710]:
                    - paragraph [ref=f2e711]:
                      - text: "Install frontend dependencies and build assets: npm install npm run dev # or"
