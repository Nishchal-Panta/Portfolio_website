            - article [ref=f23e515]:
              - generic [ref=f23e516]:
                - 'heading "RealyHack: Intelligent Candidate Ranking Subsystem" [level=1] [ref=f23e517]'
                - 'link "Permalink: RealyHack: Intelligent Candidate Ranking Subsystem" [ref=f23e518] [cursor=pointer]':
                  - /url: "#realyhack-intelligent-candidate-ranking-subsystem"
              - paragraph [ref=f23e521]: This repository contains a database-centric subsystem for staffing software focused on candidate sourcing, screening, shortlisting and assignment ranking. The project is implemented with Laravel (PHP) and MS SQL Server stored procedures that accept and return JSON payloads for business logic.
              - paragraph [ref=f23e522]:
                - strong [ref=f23e523]: What this repo demonstrates
              - list [ref=f23e524]:
                - listitem [ref=f23e525]: A production-quality stored procedure that ranks candidates for a job using JSON inputs/outputs.
                - listitem [ref=f23e526]: Database-driven business logic with advanced SQL techniques (CTEs, window functions, temporary tables, TRY/CATCH).
                - listitem [ref=f23e527]: A working Laravel backend + Blade/Tailwind frontend that exposes API endpoints and UI pages for jobs, candidates and ranking results.
                - listitem [ref=f23e528]: Seeders and migrations to reproduce the demo data and schema.
              - paragraph [ref=f23e529]:
                - strong [ref=f23e530]: Key files
              - list [ref=f23e531]:
                - listitem [ref=f23e532]:
                  - text: "SQL stored procedure:"
                  - link "sql/sp_RankCandidatesForJob.sql" [ref=f23e533] [cursor=pointer]:
                    - /url: /Albratoburner/Hackathon-relay-hack/blob/main/sql/sp_RankCandidatesForJob.sql
                - listitem [ref=f23e534]:
                  - text: "Stored-procedure deploy migration:"
                  - link "database/migrations/2025_12_28_101200_deploy_sp_rank_candidates_for_job.php" [ref=f23e535] [cursor=pointer]:
                    - /url: /Albratoburner/Hackathon-relay-hack/blob/main/database/migrations/2025_12_28_101200_deploy_sp_rank_candidates_for_job.php
                - listitem [ref=f23e536]:
                  - text: "Job seeder example:"
                  - link "database/seeders/JobOrderSeeder.php" [ref=f23e537] [cursor=pointer]:
                    - /url: /Albratoburner/Hackathon-relay-hack/blob/main/database/seeders/JobOrderSeeder.php
                - listitem [ref=f23e538]:
                  - text: "API tests:"
                  - link "tests/Feature/RankingApiTest.php" [ref=f23e539] [cursor=pointer]:
                    - /url: /Albratoburner/Hackathon-relay-hack/blob/main/tests/Feature/RankingApiTest.php
              - paragraph [ref=f23e540]:
                - strong [ref=f23e541]: Project Goals
              - list [ref=f23e542]:
                - listitem [ref=f23e543]: Showcase a realistic candidate ranking workflow used by staffing platforms.
                - listitem [ref=f23e544]: Keep the business logic inside MS SQL Server using stored procedures and JSON for robust, portable, and auditable decision making.
                - listitem [ref=f23e545]: Provide a usable UI for recruiters to run ranking jobs and inspect results.
              - paragraph [ref=f23e546]:
                - strong [ref=f23e547]: Tech stack
              - list [ref=f23e548]:
                - listitem [ref=f23e549]: "Backend: Laravel (PHP)"
                - listitem [ref=f23e550]: "Database: MS SQL Server (stored procedures, JSON input/output)"
                - listitem [ref=f23e551]: "Frontend: Laravel Blade + Tailwind CSS (Alpine.js where needed)"
                - listitem [ref=f23e552]: "Tests: PHPUnit / Laravel Test Suite"
              - paragraph [ref=f23e553]:
                - strong [ref=f23e554]: Quickstart — Local (Windows)
              - paragraph [ref=f23e555]: "Prerequisites:"
              - list [ref=f23e556]:
                - listitem [ref=f23e557]: PHP 8.1+ (matching composer requirements)
                - listitem [ref=f23e558]: Composer
                - listitem [ref=f23e559]: Node.js + npm
                - listitem [ref=f23e560]: MS SQL Server (local or network) with a user that can create databases, objects, and run stored procedures
              - paragraph [ref=f23e561]: "Steps:"
              - list [ref=f23e562]:
                - listitem [ref=f23e563]: "Copy the environment template and update DB connection values:"
              - generic [ref=f23e564]:
                - generic [ref=f23e565]:
                  - text: copy .env.example .env
                  - generic [ref=f23e566]: "# Edit .env to point to your SQL Server (DB_CONNECTION=sqlsrv, DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD)"
                - button "Copy code to clipboard" [ref=f23e568] [cursor=pointer]
              - list [ref=f23e572]:
                - listitem [ref=f23e573]: "Install PHP and JS dependencies:"
              - generic [ref=f23e574]:
                - generic [ref=f23e575]: composer install npm install npm run build
                - button "Copy code to clipboard" [ref=f23e577] [cursor=pointer]
              - list [ref=f23e581]:
                - listitem [ref=f23e582]: "Run migrations and seeders (this project includes seed data for demo jobs and candidates):"
              - generic [ref=f23e583]:
                - generic [ref=f23e584]: php artisan migrate php artisan db:seed --class=JobOrderSeeder php artisan db:seed --class=CandidateSeeder
                - button "Copy code to clipboard" [ref=f23e586] [cursor=pointer]
              - list [ref=f23e590]:
                - listitem [ref=f23e591]: "Deploy the ranking stored procedure (migration should already manage this, but you can run the SQL directly):"
              - generic [ref=f23e592]:
                - generic [ref=f23e593]: "-- Run the file: sql/sp_RankCandidatesForJob.sql on your SQL Server instance"
                - button "Copy code to clipboard" [ref=f23e596] [cursor=pointer]
              - list [ref=f23e600]:
                - listitem [ref=f23e601]: "Serve the app:"
              - generic [ref=f23e602]:
                - generic [ref=f23e603]: php artisan serve
                - button "Copy code to clipboard" [ref=f23e605] [cursor=pointer]
              - paragraph [ref=f23e609]:
                - text: Open the app in your browser at
                - link "http://127.0.0.1:8000" [ref=f23e610] [cursor=pointer]:
                  - /url: http://127.0.0.1:8000
                - text: and use the Jobs / Candidates pages to exercise the ranking workflow.
              - paragraph [ref=f23e611]:
                - strong [ref=f23e612]: Stored Procedure — JSON Input/Output
              - paragraph [ref=f23e613]:
                - text: The stored procedure accepts a JSON payload describing the job request and skill weights, and returns a JSON array of ranked candidates including score breakdowns. See
                - link "sql/sp_RankCandidatesForJob.sql" [ref=f23e614] [cursor=pointer]:
                  - /url: /Albratoburner/Hackathon-relay-hack/blob/main/sql/sp_RankCandidatesForJob.sql
                - text: for the exact parameters and example payload.
              - paragraph [ref=f23e615]: "Suggested JSON input shape (example):"
              - generic [ref=f23e616]:
                - generic [ref=f23e617]: "{ \"jobId\": 123, \"requiredSkills\": [{\"skillId\": 4, \"minLevel\": 3},{\"skillId\": 8, \"minLevel\":2}], \"weights\": {\"skill\":0.5, \"experience\":0.25, \"availability\":0.15, \"location\":0.1} }"
                - button "Copy code to clipboard" [ref=f23e619] [cursor=pointer]
              - paragraph [ref=f23e623]: Output is a JSON array where each element contains candidate id, overall score, and component scores.
              - paragraph [ref=f23e624]:
                - strong [ref=f23e625]: API / Integration
              - list [ref=f23e626]:
                - listitem [ref=f23e627]:
                  - text: The project exposes REST endpoints in
                  - code [ref=f23e628]: routes/api.php
                  - text: to run the ranking procedure and fetch results. The stored procedure is the source of truth for ranking logic and can be called from any backend (including .NET) for integration.
              - paragraph [ref=f23e629]:
                - strong [ref=f23e630]: Testing
              - paragraph [ref=f23e631]: "Run the test suite with:"
              - generic [ref=f23e632]:
